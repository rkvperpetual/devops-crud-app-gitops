replicaCount: 1

image:
  repository: 027195719990.dkr.ecr.ap-south-1.amazonaws.com/devops-task-manager
  tag: "7-2b4d0c4"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 5000

persistence:
  enabled: true
  storageClassName: gp2
  accessMode: ReadWriteOnce
  size: 2Gi

containerPort: 5000

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

probes:
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  liveness:
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
