apiVersion: v1
kind: Service

metadata:
  name: {{ include "devops-task-manager.fullname" . }}
  labels:
    {{- include "devops-task-manager.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}

  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
